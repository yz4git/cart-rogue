name: Voxel Rally CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Five full playthrough review
        run: node --import tsx --test tests/cart-five-full-playthrough-review.test.ts
      - name: Turbo Hunt regression
        run: node --import tsx --test tests/cart-phase67-78-turbo-hunt.test.ts
      - name: Battery performance regression
        run: node --import tsx --test tests/cart-phase79-performance-battery.test.ts
      - name: Environment richness regression
        run: node --import tsx --test tests/cart-phase80-environment-richness.test.ts
      - name: Hunt evolution regression
        run: node --import tsx --test tests/cart-phase81-83-hunt-evolution.test.ts
      - name: Threat and pursuit regression
        run: npm run test:threat
      - name: Threat Pressure regression
        run: npm run test:pressure
      - name: Raid intercept and damage regression
        run: npm run test:raid
      - name: Forced dodge and escape regression
        run: npm run test:escape
      - name: Hard Mode regression
        run: npm run test:hard
      - name: Resource readability regression
        run: npm run test:resources
      - name: Casual anime visual regression
        run: npm run test:visual
      - name: Toy shape regression
        run: npm run test:shape
      - name: Anime cut-in regression
        run: npm run test:cutin
      - name: Impact and AOE visual regression
        run: npm run test:fx
      - name: Enemy intelligence and balance regression
        run: npm run test:ai
      - name: Visual hierarchy and arcade presentation regression
        run: npm run test:presentation
      - name: iPhone landscape UI regression
        run: node --import tsx --test tests/cart-iphone-landscape-ui.test.ts
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Verify
        run: npm run verify
