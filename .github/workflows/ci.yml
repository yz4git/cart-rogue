name: Voxel Rally CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Turbo Hunt regression
        run: node --import tsx --test tests/cart-phase67-78-turbo-hunt.test.ts
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Verify
        run: npm run verify